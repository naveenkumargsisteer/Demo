name: Jira Approved Copilot Agent

on:
  repository_dispatch:
    types: [jira_ticket_approved]
  workflow_dispatch:
    inputs:
      ticket_id:
        description: Jira ticket ID
        required: true
        default: DEMO-102
      ticket_description:
        description: Ticket summary or task description
        required: true
        default: Update homepage hero to highlight enterprise CRM

permissions:
  contents: write
  pull-requests: write

jobs:
  slack-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Alert
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-message: |
            🤖 Jira Ticket Dispatched: ${{ github.event.client_payload.ticket_id || inputs.ticket_id }}
            Task: ${{ github.event.client_payload.ticket_description || inputs.ticket_description }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  run-copilot-agent:
    name: Execute approved repository change
    needs: slack-notification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Apply ticket update to index.html
        env:
          TICKET_ID: ${{ github.event.client_payload.ticket_id || inputs.ticket_id }}
          TICKET_DESCRIPTION: ${{ github.event.client_payload.ticket_description || inputs.ticket_description }}
        run: |
          echo "<!-- Updated for ${{ env.TICKET_ID }}: ${{ env.TICKET_DESCRIPTION }} -->" >> index.html

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "fix(${{ github.event.client_payload.ticket_id || inputs.ticket_id }}): ${{ github.event.client_payload.ticket_description || inputs.ticket_description }}"
          title: "${{ github.event.client_payload.ticket_id || inputs.ticket_id }}: ${{ github.event.client_payload.ticket_description || inputs.ticket_description }}"
          body: |
            Automated repository update following Jira ticket dispatch.

            - **Ticket:** ${{ github.event.client_payload.ticket_id || inputs.ticket_id }}
            - **Description:** ${{ github.event.client_payload.ticket_description || inputs.ticket_description }}
          branch: "feature/${{ github.event.client_payload.ticket_id || inputs.ticket_id }}"
          delete-branch: true
