name: Jira Approved Gemini AI Agent

on:
  repository_dispatch:
    types: [jira_ticket_approved]
  workflow_dispatch:
    inputs:
      ticket_id:
        description: Jira ticket ID
        required: true
        default: DEMO-102
      ticket_description:
        description: Ticket summary or task description
        required: true
        default: Update hero section to feature an enterprise CRM header

permissions:
  contents: write
  pull-requests: write

jobs:
  slack-notification:
    runs-on: ubuntu-latest
    steps:
      - name: Send Slack Alert
        uses: slackapi/slack-github-action@v1.26.0
        with:
          channel-id: ${{ secrets.SLACK_CHANNEL_ID }}
          slack-message: |
            🤖 Jira Ticket Dispatched to Gemini Agent: ${{ github.event.client_payload.ticket_id || inputs.ticket_id }}
            Task: ${{ github.event.client_payload.ticket_description || inputs.ticket_description }}
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_BOT_TOKEN }}

  run-gemini-agent:
    name: Execute Gemini AI Code Agent
    needs: slack-notification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Run Gemini AI Agent via REST API
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          TICKET_ID: ${{ github.event.client_payload.ticket_id || inputs.ticket_id }}
          TICKET_DESCRIPTION: ${{ github.event.client_payload.ticket_description || inputs.ticket_description }}
        run: |
          # Read current HTML file
          CURRENT_HTML=$(cat index.html)
          
          # Prepare the prompt
          PROMPT="You are an expert web developer AI agent. 
          Modify the following HTML code to completely fulfill this task:
          TASK ID: ${TICKET_ID}
          TASK DESCRIPTION: ${TICKET_DESCRIPTION}
          
          Return ONLY the complete modified raw HTML code. Do NOT include markdown code blocks (\\\`html) or conversational commentary."
          
          # Create JSON payload securely using jq
          PAYLOAD=$(jq -n --arg prompt "$PROMPT" --arg html "$CURRENT_HTML" '{
            "contents": [{
              "parts": [{
                "text": ($prompt + "\n\nCURRENT HTML:\n" + $html)
              }]
            }],
            "generationConfig": { "temperature": 0.2 }
          }')
          
          echo "🤖 Requesting Gemini API modification for ticket ${TICKET_ID}..."
          
          # Call Gemini REST API directly
          RESPONSE=$(curl -s -X POST "https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${GEMINI_API_KEY}" \
            -H "Content-Type: application/json" \
            -d "$PAYLOAD")
            
          # Extract response text using jq
          UPDATED_HTML=$(echo "$RESPONSE" | jq -r '.candidates[0].content.parts[0].text')
          
          # Verify API response
          if [ "$UPDATED_HTML" = "null" ] \vert{}\vert{} [ -z "$UPDATED_HTML" ]; then
            echo "❌ API Error or empty response. Full response:"
            echo "$RESPONSE"
            exit 1
          fi
          
          # Clean up any markdown formatting returned by the LLM and overwrite index.html
          printf "%s\n" "$UPDATED_HTML" | sed -e 's/^html//' -e 's/^//' -e 's/$//' > index.html          echo "✅ index.html successfully updated by Gemini REST API."

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "feat(${{ github.event.client_payload.ticket_id || inputs.ticket_id }}): ${{ github.event.client_payload.ticket_description || inputs.ticket_description }}"
          title: "${{ github.event.client_payload.ticket_id || inputs.ticket_id }}: ${{ github.event.client_payload.ticket_description || inputs.ticket_description }}"
          body: |
            Automated PR created by **Gemini AI Agent** following Jira ticket dispatch.

            - **Ticket ID:** ${{ github.event.client_payload.ticket_id || inputs.ticket_id }}
            - **Prompt/Task:** ${{ github.event.client_payload.ticket_description || inputs.ticket_description }}
          branch: "feature/${{ github.event.client_payload.ticket_id || inputs.ticket_id }}"
          delete-branch: true