name: Jira Approved Copilot Agent

on:
  repository_dispatch:
    types: [jira_ticket_approved]
  workflow_dispatch:
    inputs:
      ticket_id:
        description: Jira ticket ID
        required: true
        default: DEMO-102
      ticket_description:
        description: Ticket summary or task description
        required: true
        default: Update homepage hero to highlight enterprise CRM

permissions:
  contents: write
  pull-requests: write

jobs:
  notify-slack:
    name: Alert Slack after approval
    runs-on: ubuntu-latest
    steps:
      - name: Send approval message to Slack
        if: ${{ secrets.SLACK_WEBHOOK_URL != '' }}
        uses: slackapi/slack-github-action@v1.26.0
        with:
          payload: |
            {
              "text": "Jira ticket approved: ${{ github.event.client_payload.ticket_id || inputs.ticket_id }}",
              "attachments": [
                {
                  "color": "#36a64f",
                  "text": "Task: ${{ github.event.client_payload.ticket_description || inputs.ticket_description }}\nRepository: ${{ github.repository }}\nAction: start Copilot patch workflow"
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  run-copilot-agent:
    name: Execute approved repository change
    needs: notify-slack
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Run tests
        run: npm test

      - name: Apply approved ticket to repo
        env:
          TICKET_ID: ${{ github.event.client_payload.ticket_id || inputs.ticket_id }}
          TICKET_DESCRIPTION: ${{ github.event.client_payload.ticket_description || inputs.ticket_description }}
        run: |
          node --input-type=module - <<'NODE'
          import { applyTicketToRepository } from './lib/agent.js';

          const ticket = {
            key: process.env.TICKET_ID,
            summary: process.env.TICKET_DESCRIPTION,
            description: process.env.TICKET_DESCRIPTION
          };

          const result = await applyTicketToRepository(process.cwd(), ticket);
          console.log(JSON.stringify(result, null, 2));
          NODE

      - name: Create feature branch for the ticket
        env:
          TICKET_ID: ${{ github.event.client_payload.ticket_id || inputs.ticket_id }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          SAFE_TICKET_ID="${TICKET_ID//[^a-zA-Z0-9._-]/-}"
          BRANCH_NAME="fix/${SAFE_TICKET_ID}"
          git checkout -b "$BRANCH_NAME"
          echo "BRANCH_NAME=$BRANCH_NAME" >> "$GITHUB_ENV"

      - name: Commit repository change
        env:
          TICKET_ID: ${{ github.event.client_payload.ticket_id || inputs.ticket_id }}
          TICKET_DESCRIPTION: ${{ github.event.client_payload.ticket_description || inputs.ticket_description }}
        run: |
          git add .
          if git diff --cached --quiet; then
            echo "No repo changes detected."
            exit 0
          fi
          git commit -m "fix(${TICKET_ID}): ${TICKET_DESCRIPTION}"

      - name: Push branch to GitHub
        run: |
          git push --set-upstream origin "${BRANCH_NAME}"

      - name: Create pull request
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: ${{ env.BRANCH_NAME }}
          title: "${{ github.event.client_payload.ticket_id || inputs.ticket_id }}: ${{ github.event.client_payload.ticket_description || inputs.ticket_description }}"
          body: |
            Automated repository update following Jira approval.

            Ticket: ${{ github.event.client_payload.ticket_id || inputs.ticket_id }}
            Description: ${{ github.event.client_payload.ticket_description || inputs.ticket_description }}
          delete-branch: false